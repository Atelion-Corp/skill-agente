name: Validate skill pack

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install PyYAML
      - name: Validate every skill
        run: |
          for skill in skills/*; do
            python scripts/quick-validate.py "$skill"
          done
      - name: Check manifests are synchronized
        run: |
          python scripts/sync-manifests.py
          git diff --exit-code
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
